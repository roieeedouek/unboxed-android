syntax = "proto3";

package com.github.livingwithhippos.unchained.data.local;

// TorBox API tokens are permanent (no refresh grant for 3rd-party apps), so unlike Real-Debrid's
// OAuth credentials there is no client_id/client_secret/refresh_token/device_code to persist.
message CurrentCredential {
  string access_token = 1;
  // "manual" (pasted from torbox.app/settings) or "device_flow" (obtained via the device-code
  // login), see AUTH_METHOD_MANUAL / AUTH_METHOD_DEVICE_FLOW. Display-only, doesn't affect
  // behavior once a token is stored.
  string auth_method = 2;
}
